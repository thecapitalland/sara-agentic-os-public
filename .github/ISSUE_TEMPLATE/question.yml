name: Question
description: Ask a question about Sara Agentic OS
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Keep examples general and sanitized.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to use Sara for?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: Describe the current execution and review flow without private identifiers.
    validations:
      required: false
  - type: checkboxes
    id: sanitization
    attributes:
      label: Sanitization check
      options:
        - label: I kept the example general and sanitized.
          required: true
