name: Adoption Help
description: Ask for help applying Sara Agentic OS to a real workflow
title: "Adoption help: "
labels: ["adoption-help", "question"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow problem, not private project details. Keep all examples sanitized.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What kind of project or workflow are you trying to control?
      placeholder: Founder-led product, small engineering team, long-running repository, multi-agent workflow, etc.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Execution environment
      description: What kinds of assistants, repositories, validation systems, or communication channels are involved?
      placeholder: AI coding client, repository host, CI, review system, team chat, document store...
    validations:
      required: true
  - type: textarea
    id: pain
    attributes:
      label: Current pain
      description: What breaks, slows down, or becomes hard to verify?
      placeholder: Long sessions, copy/paste, vague done claims, stale context, review confusion...
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Current source of truth
      description: Where does the operational state live today?
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Desired outcome
      description: What should Sara help you clarify or control?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / risks
      description: What must not be automated, exposed, or changed?
    validations:
      required: false
