name: Validate public baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-public-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_baseline.py
